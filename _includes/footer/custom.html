<!--
  Scroll reveal: sections fade and rise slightly as they enter the viewport.
  Progressive enhancement — if JS is off, or the visitor prefers reduced
  motion, everything is simply visible from the start.
-->
<script>
  (function () {
    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced || !('IntersectionObserver' in window)) return;

    var targets = document.querySelectorAll('.page__content > *, .intro__body > *');
    if (!targets.length) return;

    document.documentElement.classList.add('has-reveal');
    Array.prototype.forEach.call(targets, function (el, i) {
      el.classList.add('reveal');
      el.style.transitionDelay = Math.min(i * 45, 360) + 'ms';
    });

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        entry.target.classList.add('is-visible');
        observer.unobserve(entry.target);
      });
    }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });

    Array.prototype.forEach.call(targets, function (el) { observer.observe(el); });
  })();
</script>
